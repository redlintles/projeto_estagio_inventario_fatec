name: fatec-producao
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgresql://patrimonio:${POSTGRES_PASSWORD:?}@database:5432/patrimonio
  JWT_SECRET: ${JWT_SECRET:?}
  WEB_ORIGIN: https://${SITE_HOST:?}
  UPLOAD_DIR: /app/uploads
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-patrimonio@fatec.local}
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: patrimonio
      POSTGRES_USER: patrimonio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U patrimonio -d patrimonio"]
      interval: 5s
      timeout: 3s
      retries: 30
  initialize:
    image: fatec-producao-backend:local
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    logging: *logging
    environment:
      <<: *backend-env
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:?}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?}
    depends_on:
      database:
        condition: service_healthy
    command:
      [
        sh,
        -c,
        "node ../node_modules/typeorm/cli.js migration:run -d dist/data-source.js && node dist/bootstrap.js --if-needed",
      ]
  backend:
    image: fatec-producao-backend:local
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    environment: *backend-env
    volumes:
      - photos:/app/uploads
    depends_on:
      initialize:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_HOST: ${SITE_HOST:?}
      TLS_MODE: ${TLS_MODE:-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
  photos:
  caddy_data:
  caddy_config:
