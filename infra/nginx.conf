server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 8m;
 add_header X-Content-Type-Options nosniff;
 add_header X-Frame-Options DENY;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 server_tokens off;
 location /api/ { proxy_pass http://backend:3000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
 location / { try_files $uri $uri/ /index.html; }
}
