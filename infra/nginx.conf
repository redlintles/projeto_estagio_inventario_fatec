server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 # O arquivo pode ter 8 MB; o envio também inclui os campos do formulário.
 client_max_body_size 9m;
 client_body_timeout 30s;
 client_header_timeout 15s;
 send_timeout 60s;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 server_tokens off;
 location /api/ {
  proxy_pass http://backend:3000/api/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
 }
 location / { try_files $uri $uri/ /index.html; }
}
